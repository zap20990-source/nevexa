services:
  - type: web
    name: nevexa
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@localhost:5432/nevexa
      - key: AUTH_SECRET
        value: nevexa-super-secret-key-2024
      - key: NODE_VERSION
        value: 20.x
